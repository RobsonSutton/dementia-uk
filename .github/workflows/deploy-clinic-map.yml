name: Scrape and Deploy Dementia UK Clinic Map to GitHub Pages

on:
  schedule:
    # 9 AM UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add your dependencies here
          pip install -r nbs-clinic-map/requirements.txt

      - name: Run scrape clinics script
        run: python nbs-clinic-map/scrape_clinics.py

      - name: Run generate clinic map script
        run: python nbs-clinic-map/generate_clinic_map.py

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'nbs-clinic-map/output' # Path containing your generated HTML (adjust as needed)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4